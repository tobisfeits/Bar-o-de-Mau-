<body class="min-h-screen" style="background-color: var(--bg-primary);">
    <!-- App Container -->
    <div id="app-container"></div>

    <!-- Main Application Module -->
    <script type="module" src="src/main.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        const APP_VERSION = '2026.03.23.042'; // v42 - Board Audit Report Dashboard

        // NUCLEAR CACHE CLEAR: If version doesn't match last stored, wipe everything
        if (localStorage.getItem('cd_app_version') !== APP_VERSION) {
            console.warn('🚨 EMERGENCY RECOVERY: Version mismatch! Clearing all caches...');
            if ('caches' in window) {
                caches.keys().then(names => {
                    for (let name of names) caches.delete(name);
                });
            }
            localStorage.setItem('cd_app_version', APP_VERSION);
            // Don't reload immediately to allow SW to register below
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Change the registration URL version to force a real re-fetch
                navigator.serviceWorker.register('/service-worker.js?v=' + APP_VERSION)
                    .then((registration) => {
                        console.log('✅ Service Worker registered successfully (v' + APP_VERSION + '):', registration.scope);

                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('🔄 New version available! Force refreshing...');
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('❌ Service Worker registration failed:', error);
                    });
            });
        }
    </script>
