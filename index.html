<head>
    <meta charset="UTF-8">

        html,
        body {

            color: #e2e8f0 !important;
        }
    </style>

    <link rel="icon" type="image/png" href="logo_barao_maua.png">

    <!-- PWA Manifest -->

    <!-- Theme Colors -->
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barão Mauá">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192.png">

    <!-- PWA Description -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://barao-maua-pontuacao.vercel.app/">
    <meta property="og:title" content="Barão de Mauá - Sistema de Pontuação">
    <meta property="og:description" content="Sistema de pontuação para Clube de Desbravadores Barão de Mauá">
    <meta property="og:image" content="https://barao-maua-pontuacao.vercel.app/fotos/barao-logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://barao-maua-pontuacao.vercel.app/">
    <meta property="twitter:title" content="Barão de Mauá - Sistema de Pontuação">
    <meta property="twitter:description" content="Sistema de pontuação para Clube de Desbravadores Barão de Mauá">
    <meta property="twitter:image" content="https://barao-maua-pontuacao.vercel.app/fotos/barao-logo.png">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-navy': '#1a2332',
                        'brand-gold': '#d4af37',
                        'brand-red': '#8b0000'
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="min-h-screen" style="background-color: var(--bg-primary);">
    <!-- App Container -->
    <div id="app-container"></div>

    <!-- Configuration (must load before app.js) -->
    <script src="config.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registered successfully:', registration.scope);

                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('🔄 New version available! Refresh to update.');
                                    // Optionally show a toast notification
                                    if (window.Toast) {
                                        Toast.show('Nova versão disponível! Recarregue a página.', 'info');
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('❌ Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>

</html>
