<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barão de Mauá - Sistema de Pontuação</title>
    <link rel="icon" type="image/png" href="logo_barao_maua.png">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-navy': '#1a2332',
                        'brand-gold': '#d4af37',
                        'brand-red': '#8b0000'
                    }
                }
            }
        }
    </script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- App Container -->
    <div id="app"></div>

    <!-- Configuration (must load before app.js) -->
    <script src="config.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>

    <!-- Initialize app after config is loaded -->
    <script>
            // Wait for config to initialize, then start the app
            (async () => {
                await ENV_CONFIG.init();
                // App will auto-initialize when DOM is ready
            })();
    </script>
</body>

</html>
