<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Membros Deletados</title>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 50;
            animation: slideIn 0.3s ease-out;
        }

        .toast-success {
            background-color: #10b981;
        }

        .toast-error {
            background-color: #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="min-h-screen p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    <i data-lucide="trash-2" class="text-red-500"></i>
                    Lixeira de Membros
                </h1>
                <p class="text-slate-400 mt-2">Gerencie e restaure membros que foram deletados</p>
            </div>
            <a href="/"
                class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i data-lucide="arrow-left"></i>
                Voltar ao App
            </a>
        </header>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4">
            </div>
            <p class="text-slate-400">Carregando membros deletados...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state"
            class="hidden text-center py-16 bg-slate-800/50 rounded-xl border border-slate-700 border-dashed">
            <div class="bg-slate-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle" class="w-8 h-8 text-green-500"></i>
            </div>
            <h3 class="text-xl font-medium text-white mb-2">Lixeira Vazia</h3>
            <p class="text-slate-400">Não há membros deletados no sistema.</p>
        </div>

        <!-- Members List -->
        <div id="members-list" class="hidden space-y-4">
            <!-- Items injected by JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { SUPABASE_CONFIG } from './src/config/env.js';
        import { DataAdapter } from './src/data/repository.js';

        // Initialize App
        async function init() {
            try {
                await SUPABASE_CONFIG.initialize();
                await loadDeletedMembers();
            } catch (error) {
                console.error('Initialization error:', error);
                showToast('Erro ao inicializar o sistema', 'error');
            }
        }

        // Load Data
        async function loadDeletedMembers() {
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            const list = document.getElementById('members-list');

            loading.classList.remove('hidden');
            emptyState.classList.add('hidden');
            list.classList.add('hidden');

            try {
                const deletedMembers = await DataAdapter.getDeletedMembers();
                console.log('Deleted members:', deletedMembers);

                if (deletedMembers.length === 0) {
                    loading.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Render Items
                list.innerHTML = deletedMembers.map(member => {
                    const deletedDate = new Date(member.deleted_at).toLocaleString('pt-BR', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });

                    // Safe unit display (in case units not loaded, just show ID or placeholder)
                    const unitInfo = member.unit_id ? `Unidade ID: ${member.unit_id}` : 'Sem unidade';

                    return `
                        <div class="bg-slate-800 p-5 rounded-xl flex justify-between items-center border border-slate-700 hover:border-slate-500 transition-colors shadow-lg">
                            <div class="flex items-center gap-4">
                                <div class="bg-red-500/10 p-3 rounded-full">
                                    <i data-lucide="user-x" class="text-red-500 w-6 h-6"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg text-white">${member.name}</h3>
                                    <div class="flex flex-col sm:flex-row gap-1 sm:gap-4 text-sm text-slate-400 mt-1">
                                        <span class="flex items-center gap-1">
                                            <i data-lucide="calendar" class="w-3 h-3"></i> Deletado em: ${deletedDate}
                                        </span>
                                        <span class="hidden sm:inline">•</span>
                                        <span>${unitInfo}</span>
                                    </div>
                                </div>
                            </div>
                            <button onclick="window.handleRestore('${member.id}')" 
                                    class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg flex items-center gap-2 transition-all shadow-md hover:shadow-blue-500/20 active:scale-95 font-medium">
                                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                Restaurar
                            </button>
                        </div>
                    `;
                }).join('');

                loading.classList.add('hidden');
                list.classList.remove('hidden');
                lucide.createIcons();

            } catch (error) {
                console.error('Error loading deleted members:', error);
                loading.classList.add('hidden');
                showToast('Erro ao carregar membros deletados', 'error');
            }
        }

        // Restore Handler
        window.handleRestore = async (id) => {
            if (!confirm('Tem certeza que deseja restaurar este membro? Ele voltará a aparecer nas listas ativas.')) return;

            // Show restoring state button UI could be improved here, but alert is fine for now
            try {
                await DataAdapter.restoreMember(id);
                showToast('Membro restaurado com sucesso!', 'success');
                await loadDeletedMembers(); // Reload list
            } catch (error) {
                console.error('Error restoring member:', error);
                showToast('Erro ao restaurar membro', 'error');
            }
        };

        // Simple Toast
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initialize
        init();
    </script>
</body>

</html>
