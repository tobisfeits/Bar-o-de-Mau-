<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetar App - Barão de Mauá</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            color: #f43f5e;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #f43f5e;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>⚠️ Resetar Aplicativo</h1>
        <p>Se o aplicativo parou de funcionar ou não está atualizando, use este botão para limpar todos os dados locais
            e baixar a versão mais recente.</p>

        <button onclick="resetApp()" id="btnFn">
            LIMPAR TUDO E REINICIAR
        </button>

        <div id="status" class="status"></div>
    </div>

    <script>
        async function resetApp() {
            const btn = document.getElementById('btnFn');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = 'Limpando...';
            status.innerHTML = 'Iniciando limpeza...';

            try {
                // 1. Unregister Service Workers
                if ('serviceWorker' in navigator) {
                    status.innerHTML += '<br>Removendo Service Workers...';
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                }

                // 2. Clear Caches
                status.innerHTML += '<br>Apagando Cache...';
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for (const key of keys) {
                        await caches.delete(key);
                    }
                }

                // 3. Clear Storage
                status.innerHTML += '<br>Apagando Dados Locais...';
                localStorage.clear();
                sessionStorage.clear();

                // 4. Clear IndexedDB (Supabase Auth uses this potentially)
                if (window.indexedDB) {
                    const dbs = await window.indexedDB.databases();
                    for (const db of dbs) {
                        window.indexedDB.deleteDatabase(db.name);
                    }
                }

                status.innerHTML += '<br><span class="success">✅ Limpeza concluída! Reiniciando...</span>';

                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);

            } catch (error) {
                console.error(error);
                status.innerHTML += `<br><span class="error">❌ Erro: ${error.message}</span>`;
                btn.disabled = false;
                btn.innerText = 'Tentar Novamente';
            }
        }
    </script>
</body>

</html>
